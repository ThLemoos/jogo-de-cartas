<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogo de Cartas</title>
    <link rel="stylesheet" href="style.css" />

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#c9c4b0" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Jogo de Cartas" />
</head>

<body>

    <div id="game">

        <header id="header">
            <div id="info-left">
                <div class="player-tag cpu-tag">
                    <span class="dot" id="cpu-dot"></span>
                    <span id="cpu-name">CPU</span>
                    <span class="card-count" id="cpu-count">0</span>
                </div>
            </div>
            <div id="color-display">
                <span id="active-color-pill">—</span>
            </div>
            <div id="info-right">
                <button id="menu-btn" onclick="backToMenu()" aria-label="Menu">☰</button>
                <button id="restart-btn" onclick="restartClicked()" aria-label="Reiniciar">↺</button>
            </div>
        </header>

        <div id="status-bar">
            <span id="status">Carregando...</span>
        </div>

        <section id="cpu-area">
            <div id="cpu-hand"></div>
        </section>

        <section id="table-area">
            <div id="draw-pile" onclick="playerDraw()">
                <div class="pile-inner">🂠</div>
                <span class="pile-label">Comprar</span>
            </div>
            <div id="discard-zone"></div>
        </section>

        <section id="player-area">
            <div class="player-tag" id="player-tag-label">
                <span class="dot" id="player-dot"></span>
                Você
                <span class="card-count" id="player-count">0</span>
            </div>
            <div id="player-hand"></div>
            <div id="uno-wrap">
                <button id="uno-btn" onclick="callUno()">UNO!</button>
            </div>
            <h1 style="text-align: center;">Sandy, a curiosinha</h1>
            <p style="text-align: center; font-family: verdana;">Se você falar "não posso contar", pronto… agora ela precisa saber ainda mais.</p>
        </section>

    </div>

    <div id="lobby">
        <div id="lobby-box">
            <h2>Jogo de Cartas</h2>
            <p class="lobby-sub">Sandy, a curiosinha</p>

            <div id="lobby-menu" class="lobby-view">
                <label class="lobby-label" for="player-name">Seu nome</label>
                <input id="player-name" maxlength="16" placeholder="Como te chamam?" autocomplete="off" />
                <button class="lobby-btn primary" onclick="startCpuGame()">🤖 Jogar contra a CPU</button>
                <button class="lobby-btn" onclick="hostRoom()">🌐 Criar sala online</button>
                <button class="lobby-btn" onclick="lobbyView('join')">🔗 Entrar com código</button>
            </div>

            <div id="lobby-host" class="lobby-view" style="display:none">
                <p>Passe este código para seu amigo:</p>
                <div id="room-code">·····</div>
                <button class="lobby-btn" onclick="copyInvite()">📋 Copiar link de convite</button>
                <p id="host-msg" class="lobby-msg">Criando sala...</p>
                <button class="lobby-btn ghost" onclick="lobbyView('menu')">← Voltar</button>
            </div>

            <div id="lobby-join" class="lobby-view" style="display:none">
                <label class="lobby-label" for="join-code">Código da sala</label>
                <input id="join-code" maxlength="8" placeholder="EX: K7P2M" autocomplete="off"
                    autocapitalize="characters" />
                <button class="lobby-btn primary" onclick="joinRoom()">Entrar na sala</button>
                <p id="join-msg" class="lobby-msg"></p>
                <button class="lobby-btn ghost" onclick="lobbyView('menu')">← Voltar</button>
            </div>
        </div>
    </div>

    <div id="overlay" style="display:none">
        <div id="color-picker">
            <p>Escolha uma cor</p>
            <div class="swatches">
                <button class="swatch" style="background:#e74c3c" onclick="pickColor('red')"
                    aria-label="Vermelho"></button>
                <button class="swatch" style="background:#27ae60" onclick="pickColor('green')"
                    aria-label="Verde"></button>
                <button class="swatch" style="background:#2980b9" onclick="pickColor('blue')"
                    aria-label="Azul"></button>
                <button class="swatch" style="background:#f39c12" onclick="pickColor('yellow')"
                    aria-label="Amarelo"></button>
            </div>
        </div>
    </div>

    <div id="zoom-overlay" style="display:none" onclick="closeZoom()">
        <div id="zoom-photo"></div>
    </div>

    <div id="end-overlay" style="display:none">
        <div id="end-box">
            <div id="end-photo"></div>
            <h2 id="end-title"></h2>
            <p id="end-msg"></p>
            <button id="end-btn" onclick="playAgain()">Jogar de novo</button>
        </div>
    </div>

    <script src="js/peerjs.min.js"></script>
    <script src="js/script.js"></script>
    <script src="js/online.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
        }
    </script>
</body>

</html>
